[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openglcontext-marble-demo"
# Read from src/openglcontext_marble_demo/__init__.py -- see
# [tool.setuptools.dynamic]. One definition, because
# .github/workflows/release.yml decides whether to publish by reading
# ``__version__``, and a second copy here that drifted from it would mean the
# version checked against PyPI was not the version built.
dynamic = ["version"]
description = "Marble Madness re-interpretation for OpenGLContext: procedurally generated tracks, reflective PBR marbles, spin-to-steer physics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "ASSET-LICENSES.md"]
authors = [{ name = "Mike C. Fletcher", email = "vrplumber@gmail.com" }]
keywords = ["OpenGLContext", "OpenGL", "physics", "game", "marble", "PBR", "demo", "3D"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "OpenGLContext>=3.0.0a5",
    "omi_physics>=0.4.0",
    "numpy>=2.0",
    "PyOpenGL>=4.0.0a1",
    "glfw>=2.5",
]

[project.optional-dependencies]
# Recording to video (``--record``).  Optional because the encoder is the one in
# the graphics driver and not every machine has one the bindings know; without
# it everything runs as before and asking to record says what is missing.
video = ["OpenGLContext[video]"]
# Pillow is the render smoke test's only extra need: it reads back the captured
# frame. That test skips where there is no GL display, so the extra installs
# and the suite runs on a CI runner with neither.
test = ["pytest>=7", "pytest-timeout", "pillow"]
dev = ["openglcontext-marble-demo[test,video]", "ruff", "mypy"]

[project.urls]
Homepage = "http://pyopengl.sourceforge.net/context/"

[project.scripts]
oglc-marble = "openglcontext_marble_demo.run:main"

[tool.setuptools.dynamic]
version = { attr = "openglcontext_marble_demo.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Bundle the runtime assets the demo loads (grout colour + normal maps).
[tool.setuptools.package-data]
openglcontext_marble_demo = ["assets/*"]

# Lint standard: the engine's E/W/F/B base, plus import-order, pyupgrade and
# blind-except checks, as glisteel and the forest demo use.
[tool.openglcontext-checks]
# The OGC rules (openglcontext-checks) this project is clean of, held by
# the workspace preflight. The others join as the project reaches zero of
# each; the counts are in openglcontext/plans/DEFECT-PREVENTION.md.
select = ["OGC101", "OGC102", "OGC111", "OGC121", "OGC131", "OGC141", "OGC201", "OGC221", "OGC222", "OGC223"]

[tool.openglcontext-checks.scopes]
# The board file reader, which OGC101, OGC102 and OGC111 hold to checked
# values, sizes and paths.
loader = ["src/openglcontext_marble_demo/levelfile.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # import ordering
    "UP",   # pyupgrade
    "BLE",  # no blind except
    "S110", # no silent try/except/pass
    "PGH003", "PGH004",  # a type: ignore or noqa names the codes it silences
    "PLE0604", "PLE0605",  # __all__ is a list or tuple of strings
    "TID251",  # the raw forms the engine has an API for (banned-api, below)
    "RUF100",  # every noqa silences something
    "RUF012",  # a mutable class attribute is declared ClassVar
    "SLF001",  # a private name is used only by the module that owns it
    "ARG",  # every parameter is used, or is fixed by the protocol that calls it
    "S112", "E722", "TRY400",  # an error is neither skipped past nor logged without its traceback
    "DTZ",  # datetimes carry their timezone
    "S102", "S202", "S301", "S307", "S310",  # no exec, eval, pickle, unchecked tar extraction or url opening
]
ignore = [
    "E501",   # line too long -- kept readable by hand, as in the engine
    "E741",   # ambiguous name -- x/y/z read naturally as coordinates
    "UP031",  # percent formatting, as the engine uses throughout
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The workspace's banned-api list (openglcontext/plans/DEFECT-PREVENTION.md):
# the raw form, and the engine API that replaces it. The modules that
# implement a replacement, and the programs and tests that set the process
# environment, are exempted in per-file-ignores.
"urllib.request.urlopen".msg = "fetch through OpenGLContext.loaders.resolver: Resolver.fetch, fetch_url, or AllowedHosts.open_url for a service's own hosts"
"urllib.request.urlretrieve".msg = "fetch through OpenGLContext.loaders.resolver: fetch_to_cache, or AllowedHosts.open_url for a service's own hosts"
"tarfile.TarFile.extractall".msg = "unpack through OpenGLContext.contentpacks.archive.extract, which refuses a member that leaves the directory and caps the size"
"zipfile.ZipFile.extractall".msg = "unpack through OpenGLContext.contentpacks.archive.extract, which refuses a member that leaves the directory and caps the size"
"shutil.rmtree".msg = "replace or remove a directory through OpenGLContext.atomicfiles: staged_directory, replace_directory or remove_directory"
"shutil.move".msg = "move a finished file or directory into place through OpenGLContext.atomicfiles: staged_file, staged_directory or replace_directory"
"os.rename".msg = "os.rename refuses an existing target on Windows; use os.replace, or OpenGLContext.atomicfiles"
"os.environ".msg = "read a switch once, through OpenGLContext.renderoptions.env_flag_once / env_number_once, or in the program's start-up"
"os.getenv".msg = "read a switch once, through OpenGLContext.renderoptions.env_flag_once / env_number_once, or in the program's start-up"
"os._exit".msg = "exit through OpenGLContext.testing.process_exit.flush_and_exit, which flushes what was written first"
"time.time".msg = "ask OpenGLContext.events.systemtime.systemTime(), which a capture's fixed-step clock drives"

[tool.ruff.lint.per-file-ignores]
# run.py sets the OPENGLCONTEXT_* environment the engine reads at import time,
# so its imports deliberately are not all at the top, and it is the program's
# start-up, where the environment is set (TID251).
"src/openglcontext_marble_demo/run.py" = ["E402", "TID251"]
"tools/capture.py" = ["E402", "TID251"]
# A test sets the environment of the process it starts.
"tests/*" = ["TID251"]

[tool.mypy]
# 3.12 rather than the 3.10 floor in ``requires-python``: numpy's own stubs use
# 3.12 type syntax, so checking against 3.10 fails before it reaches any code
# here. What the floor promises is checked by the test suite, which runs on it.
python_version = "3.12"
# Every definition states its types, and a body is checked rather than skipped:
# an unannotated parameter is `Any`, and an `Any` travelling through a call is
# a check that reports success without having compared anything.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# The toolkits with no declarations to read. The engine, the physics and the
# bindings all ship ``py.typed``, so what this demo asks of them is compared
# against what they promise. Saying the rest per package keeps the silence
# deliberate and narrow: anything else that cannot be resolved is still an
# error worth seeing, which a bare global ignore would hide.
[[tool.mypy.overrides]]
module = ["glfw.*", "PIL.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 300
markers = [
    "needs_gl: opens a real GL window; skipped where there is no display",
    # The autopilot is judged by whether it finishes boards, which means driving
    # them: a minute of simulation, and most of what the suite costs. Marked
    # rather than removed -- what they measure is the point of having a pilot --
    # so a working loop can be `-m "not slow"` and a full run is the default.
    "slow: drives whole boards; seconds rather than milliseconds",
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in src/openglcontext_marble_demo/__init__.py, so name that file too:
# without it a version bump leaves uv answering with the previous number, and a
# dependent requiring the new one resolves against PyPI rather than this
# checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/openglcontext_marble_demo/__init__.py" }]
